<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#11151c" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Timeline" />
<title>Timeline</title>
<style>
  :root {
    --bg: #11151c;
    --panel: #1b212b;
    --panel-2: #232b38;
    --line: #5b6677;
    --text: #e7ecf3;
    --muted: #93a0b4;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; -webkit-user-select: none; user-select: none; }

  /* Toolbar */
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid #0006;
    border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:hover { background: #2b3545; }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { background: #c0392b; border-color: transparent; color: #fff; }
  button.icon { width: 40px; padding: 8px 0; text-align: center; }

  /* ---- Left slide-out drawer (primary navigation) ---- */
  /* Hamburger button: top-left corner, always visible, toggles the drawer */
  #menuBtn { position: fixed; z-index: 70;
    top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left));
    width: 44px; height: 44px; border-radius: 10px; padding: 0;
    background: rgba(27,33,43,.92); backdrop-filter: blur(6px); border: 1px solid #0007;
    display: grid; place-items: center; box-shadow: 0 4px 14px #0006; }
  #menuBtn .bars { display: inline-flex; flex-direction: column; gap: 4px; width: 20px; }
  #menuBtn .bars span { height: 2px; background: var(--text); border-radius: 2px; display: block; }

  #drawerBackdrop { position: fixed; inset: 0; z-index: 68; background: #0007; opacity: 0;
    pointer-events: none; transition: opacity .2s ease; }
  body.drawer-open #drawerBackdrop { opacity: 1; pointer-events: auto; }

  #drawer { position: fixed; top: 0; left: 0; bottom: 0; z-index: 69; width: 240px;
    background: var(--panel); border-right: 1px solid #0007; box-shadow: 6px 0 24px #0008;
    transform: translateX(-100%); transition: transform .25s ease;
    display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top)) 10px 14px;
    padding-left: calc(10px + env(safe-area-inset-left)); gap: 4px; }
  body.drawer-open #drawer { transform: translateX(0); }
  #drawer .brand { font-weight: 700; font-size: 18px; letter-spacing: .3px; padding: 4px 8px 12px; }
  #drawer .navbtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: transparent; border: none; border-radius: 8px; padding: 12px 12px; font-size: 15px; }
  #drawer .navbtn:hover { background: var(--panel-2); }
  #drawer .navbtn.active { background: var(--accent); color: #fff; }
  #drawer .navbtn .ic { width: 20px; text-align: center; }
  #drawer .sep { height: 1px; background: #0006; margin: 8px 6px; }
  #drawer .grow { flex: 1; }
  #drawer .navbtn.danger { color: #ff9a8f; }

  /* ---- Floating add button (timeline only) + its popup ---- */
  #fab { position: fixed; z-index: 55; bottom: calc(18px + env(safe-area-inset-bottom));
    right: calc(18px + env(safe-area-inset-right)); width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none; font-size: 30px; line-height: 1;
    display: grid; place-items: center; box-shadow: 0 8px 22px #0008; padding: 0; }
  body.calendar #fab, body.calendar #fabMenu { display: none; }
  #fabMenu { position: fixed; z-index: 56; bottom: calc(84px + env(safe-area-inset-bottom));
    right: calc(18px + env(safe-area-inset-right)); background: var(--panel);
    border: 1px solid #0007; border-radius: 12px; box-shadow: 0 14px 34px #000a; padding: 6px;
    min-width: 180px; display: none; }
  #fabMenu.show { display: block; }
  #fabMenu button { display: block; width: 100%; text-align: left; background: transparent;
    border: none; border-radius: 8px; padding: 11px 12px; font-size: 15px; }
  #fabMenu button:hover { background: var(--panel-2); }
  #fabMenu .sep { height: 1px; background: #0006; margin: 6px 4px; }

  /* Canvas (no top bar now — starts at top, with safe-area padding) */
  #viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

  svg.layer { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  /* Event cards */
  .card { position: absolute; width: 190px; background: var(--panel); border: 1px solid #0007;
    border-left: 5px solid var(--accent); border-radius: 10px; padding: 8px 10px;
    box-shadow: 0 6px 18px #0006; cursor: grab; }
  .card.dragging { cursor: grabbing; box-shadow: 0 10px 26px #0009; }
  .card .hdr { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .card .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .card .date { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card .body { margin-top: 8px; font-size: 13px; color: #d4dce8; white-space: pre-wrap;
    border-top: 1px solid #0006; padding-top: 8px; }
  .card .row { display: flex; gap: 6px; margin-top: 8px; }
  .card .row button { padding: 4px 8px; font-size: 12px; }
  .card.past { filter: grayscale(1) brightness(.72); opacity: .72; }

  /* Range bars */
  .range { position: absolute; border-radius: 6px; padding: 3px 8px; overflow: hidden;
    font-size: 12px; cursor: pointer; border: 1px solid #ffffff22; }
  .range .rh { font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .range.past { filter: grayscale(1) brightness(.7); }

  /* Month labels + controls live in world space */
  .monthlabel { position: absolute; color: var(--text); font-weight: 600; font-size: 13px;
    transform: translateX(6px); pointer-events: none; }
  /* Sunday day-of-month numbers under the ruler ticks */
  .sunnum { position: absolute; color: var(--muted); font-size: 10px; pointer-events: none;
    transform: translateX(-50%); }
  /* Daily ticks fade when zoomed far out; Sunday ticks + numbers + month lines stay */
  .day-tick { transition: opacity .15s linear; }
  body.zoomed-out .day-tick { opacity: 0; }
  .addmonth, .delmonth { position: absolute; width: 30px; height: 30px; border-radius: 50%; padding: 0;
    font-size: 18px; line-height: 1; display: grid; place-items: center; }
  .delmonth { font-size: 15px; background: #3a2730; border-color: #0006; color: #e9a8a8; }
  .delmonth:hover { background: #4a2a30; }

  /* Today marker — low-opacity vertical bar spanning the timeline */
  .today-bar { position: absolute; top: -40px; height: 360px; width: 3px; transform: translateX(-1.5px);
    background: #ffffff; opacity: .14; pointer-events: none; border-radius: 2px; }

  /* Goal markers on the timeline (distinct from event cards) */
  .goal-marker { position: absolute; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;
    background: #2a2410; border: 1px solid #f5c51855; border-radius: 999px; padding: 3px 9px; cursor: pointer;
    font-size: 12px; font-weight: 600; color: #f5c518; white-space: nowrap; box-shadow: 0 4px 12px #0007; }
  .goal-marker .gm-t { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .goal-marker.past { filter: grayscale(1) brightness(.8); color: #c9c9c9; }

  /* NuvaRing cycle strip (world space, bottom of timeline) */
  .cycle-seg { position: absolute; border-radius: 3px; cursor: pointer; }
  .cycle-start { position: absolute; background: var(--panel-2); border: 1px solid #0006;
    border-radius: 8px; padding: 6px 10px; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .cycle-start:hover { background: #2b3545; }
  .cycle-label { position: absolute; color: var(--muted); font-size: 11px; pointer-events: none; white-space: nowrap; }
  .cycle-legend { display: flex; gap: 14px; align-items: center; margin: 8px 0 2px; font-size: 13px; }
  .cycle-legend .sw { display: inline-block; width: 22px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

  /* Modal */
  #scrim { position: fixed; inset: 0; background: #0008; z-index: 100; display: none; align-items: center; justify-content: center; }
  #scrim.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid #0007; border-radius: 14px; padding: 18px;
    width: min(440px, 92vw); max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px #000a; }
  .modal h3 { margin: 0 0 12px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input, .modal textarea, .modal select { width: 100%; font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid #0006; border-radius: 8px; padding: 8px 10px; }
  .modal input[type=color] { height: 40px; padding: 4px; }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .modal .warn { background: #3a2a1f; border: 1px solid #7a5a2a; color: #f0c98a; border-radius: 8px; padding: 8px 10px; font-size: 13px; }

  /* Category manager rows */
  .catrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #0005; }
  .catrow .cname { flex: 1; }
  .catrow .cdot { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; }
  .catrow input[type=color] { width: 36px; height: 32px; padding: 2px; }
  .catrow input.rename { flex: 1; }
  .catrow button { padding: 5px 8px; font-size: 12px; }
  .addcat { display: flex; gap: 8px; margin-top: 12px; }
  .addcat input[type=text] { flex: 1; }
  .addcat input[type=color] { width: 44px; }

  /* Calendar section — full height, no top bar */
  #calendar { position: fixed; inset: 0; display: none; flex-direction: column;
    background: var(--bg); padding-top: env(safe-area-inset-top); }
  body.calendar #calendar { display: flex; }
  body.calendar #viewport { display: none; }
  /* leave room on the left so the hamburger button doesn't cover the controls */
  #calbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 64px; border-bottom: 1px solid #0007;
    flex-wrap: wrap; }
  #calbar .period { font-weight: 600; font-size: 15px; margin: 0 4px; min-width: 150px; }
  #calbar .spacer { flex: 1; }
  #calModeToggle { display: inline-flex; border: 1px solid #0006; border-radius: 8px; overflow: hidden; }
  #calModeToggle button { border: none; border-radius: 0; background: var(--panel-2); padding: 8px 12px; }
  #calModeToggle button.active { background: var(--accent); color: #fff; }
  #calbody { flex: 1; overflow: auto; position: relative; }

  /* Month grid */
  .cal-weekhead { display: grid; grid-template-columns: repeat(7, 1fr); position: sticky; top: 0; z-index: 2;
    background: var(--panel); border-bottom: 1px solid #0007; }
  .cal-weekhead div { padding: 6px 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; }
  .cal-month { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(96px, 1fr); }
  .cal-day { border-right: 1px solid #0005; border-bottom: 1px solid #0005; padding: 4px; min-height: 96px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .cal-day:hover { background: var(--panel-2); }
  .cal-day.othermonth { opacity: .4; }
  .cal-day.past { filter: grayscale(1) brightness(.78); }
  .cal-day.today .cal-daynum { background: var(--accent); color: #fff; border-radius: 50%;
    width: 22px; height: 22px; display: grid; place-items: center; }
  .cal-daynum { font-size: 12px; color: var(--muted); font-weight: 600; }
  .cal-chip { font-size: 11px; line-height: 1.3; padding: 1px 5px; border-radius: 4px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--accent); }
  .cal-chip:hover { filter: brightness(1.15); }
  .cal-chip.period { border-left: none; color: #fff; }
  .cal-more { font-size: 10px; color: var(--muted); padding: 0 4px; }

  /* Week view */
  .cal-week { display: grid; grid-template-columns: 54px repeat(7, 1fr); min-height: 100%; }
  .cal-week-head { display: grid; grid-template-columns: 54px repeat(7, 1fr); position: sticky; top: 0; z-index: 3;
    background: var(--panel); border-bottom: 1px solid #0007; }
  .cal-week-head .wh { padding: 6px 4px; text-align: center; font-size: 12px; color: var(--muted); font-weight: 600;
    border-right: 1px solid #0005; }
  .cal-week-head .wh.today { color: var(--text); }
  .cal-week-head .wh.today .wd { background: var(--accent); color: #fff; border-radius: 10px; padding: 0 6px; display: inline-block; }
  .cal-week-allday { display: grid; grid-template-columns: 54px repeat(7, 1fr); border-bottom: 1px solid #0007;
    background: var(--panel-2); }
  .cal-week-allday .ad-label { font-size: 10px; color: var(--muted); padding: 4px; border-right: 1px solid #0005; }
  .cal-week-allday .ad-col { padding: 3px; border-right: 1px solid #0005; display: flex; flex-direction: column; gap: 2px; min-height: 20px; }
  .cal-week-allday .ad-col.past { filter: grayscale(1) brightness(.78); }
  .cal-hours { position: relative; }
  .cal-hourrow { display: grid; grid-template-columns: 54px repeat(7, 1fr); height: 44px; }
  .cal-hourrow .hr-label { font-size: 11px; color: var(--muted); padding: 0 6px; text-align: right;
    border-right: 1px solid #0005; transform: translateY(-7px); }
  .cal-hourrow .hr-cell { border-right: 1px solid #0005; border-top: 1px solid #0004; cursor: pointer; }
  .cal-hourrow .hr-cell:hover { background: var(--panel-2); }
  .cal-weekcols { position: absolute; left: 54px; right: 0; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(7, 1fr);
    pointer-events: none; }
  .cal-weekcol { position: relative; pointer-events: none; }
  .cal-task { position: absolute; left: 2px; right: 2px; border-radius: 5px; padding: 2px 5px; font-size: 11px;
    overflow: hidden; color: #fff; cursor: pointer; pointer-events: auto; border: 1px solid #ffffff22; box-shadow: 0 2px 6px #0006; }
  .cal-task .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-task.past { filter: grayscale(1) brightness(.78); }
  .cal-empty { color: var(--muted); padding: 24px; text-align: center; }

  /* ---- Goals section ---- */
  #goals { position: fixed; inset: 0; display: none; flex-direction: column; background: var(--bg);
    padding-top: env(safe-area-inset-top); overflow: auto; }
  body.goals #goals { display: flex; }
  body.goals #viewport, body.goals #calendar, body.goals #fab, body.goals #fabMenu { display: none; }
  #goalsbody { flex: 1; padding: 16px 16px 90px calc(16px + 44px); max-width: 720px; width: 100%; margin: 0 auto; }
  .goal-group { margin-bottom: 22px; }
  .goal-group h2 { font-size: 15px; color: var(--muted); font-weight: 700; letter-spacing: .4px;
    text-transform: uppercase; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .goal-group .addgoal { margin-left: auto; font-size: 13px; padding: 5px 10px; }
  .goal-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel);
    border: 1px solid #0007; border-left: 4px solid var(--goal, #f5c518); border-radius: 10px; margin-bottom: 8px; }
  .goal-item .chk { width: 22px; height: 22px; flex: 0 0 auto; border-radius: 6px; border: 2px solid #6b7483;
    display: grid; place-items: center; cursor: pointer; font-size: 14px; color: var(--bg); background: transparent; }
  .goal-item .chk.on { background: var(--goal, #f5c518); border-color: var(--goal, #f5c518); }
  .goal-item { cursor: pointer; }
  .goal-item .gdot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--goal, #f5c518); }
  .goal-item .gchev { color: var(--muted); font-size: 18px; flex: 0 0 auto; }
  .goal-item .gmain { flex: 1; min-width: 0; }
  .goal-item .gtitle { font-weight: 600; }
  .goal-item .gmeta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .goal-item .gmiss { font-size: 12px; padding: 5px 8px; }
  .goal-empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }

  #goalChartBtn { position: fixed; z-index: 55; bottom: calc(18px + env(safe-area-inset-bottom));
    right: calc(18px + env(safe-area-inset-right)); width: 56px; height: 56px; border-radius: 50%;
    background: var(--goal, #f5c518); color: #1b212b; border: none; font-size: 24px;
    display: none; place-items: center; box-shadow: 0 8px 22px #0008; padding: 0; }
  body.goals #goalChartBtn { display: grid; }

  /* chart / archive modal */
  .chart-toggle { display: inline-flex; border: 1px solid #0006; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .chart-toggle button { border: none; border-radius: 0; background: var(--panel-2); padding: 7px 12px; }
  .chart-toggle button.active { background: var(--accent); color: #fff; }
  .chart-stats { display: flex; gap: 18px; margin: 4px 0 12px; font-size: 13px; color: var(--muted); }
  .chart-stats b { color: var(--text); font-size: 16px; }
  .arch-item { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid #0005; font-size: 14px; }
  .arch-item .tag { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
  .arch-item .tag.hit { background: #1f3a2a; color: #7fe0a0; }
  .arch-item .tag.missed { background: #3a2027; color: #e98ba0; }
  .arch-item .at { flex: 1; min-width: 0; }
  .arch-item .adate { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <!-- Left drawer: primary navigation (Timeline / Calendar / Edit categories) -->
  <div id="drawerBackdrop"></div>
  <button id="menuBtn" aria-label="Open menu">
    <span class="bars"><span></span><span></span><span></span></span>
  </button>
  <nav id="drawer">
    <div class="brand">Timeline</div>
    <button class="navbtn active" id="nav_timeline"><span class="ic">▭</span> Timeline</button>
    <button class="navbtn" id="nav_calendar"><span class="ic">▦</span> Calendar</button>
    <button class="navbtn" id="nav_goals"><span class="ic">◎</span> Goals</button>
    <div class="sep"></div>
    <button class="navbtn" id="nav_cats"><span class="ic">◉</span> Edit categories</button>
    <button class="navbtn" id="nav_fit"><span class="ic">⤢</span> Fit to start</button>
    <div class="grow"></div>
  </nav>

  <!-- Floating add button (timeline only) -->
  <button id="fab" aria-label="Add">+</button>
  <div id="fabMenu">
    <button id="fab_event">+ Event</button>
    <button id="fab_range">+ Range</button>
    <div class="sep"></div>
    <button id="fab_cats">Edit categories</button>
  </div>

  <div id="viewport">
    <div id="world">
      <svg class="layer" id="axisLayer"></svg>
      <svg class="layer" id="edgeLayer"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <div id="calendar">
    <div id="calbar">
      <button id="cal_prev" class="icon" title="Previous">‹</button>
      <button id="cal_today">Today</button>
      <button id="cal_next" class="icon" title="Next">›</button>
      <span class="period" id="cal_period"></span>
      <span class="spacer"></span>
      <span id="calModeToggle">
        <button id="cm_month" class="active">Month</button>
        <button id="cm_week">Week</button>
      </span>
    </div>
    <div id="calbody"></div>
  </div>

  <!-- Goals section -->
  <div id="goals">
    <div id="goalsbody"></div>
    <!-- floating button (bottom-right): open the progress chart / archive -->
    <button id="goalChartBtn" aria-label="Progress chart">📈</button>
  </div>

  <div id="scrim">
    <div class="modal" id="modal"></div>
  </div>

<script type="module">
/* ============================================================================
   Timeline — zero-dependency installable PWA (prototype → app).
   Axis + manually-added/removable months, zoom/pan (min zoom ~2 months),
   events as draggable cards with a FIXED connector to their axis date and
   click-to-expand, ranges as low-opacity bars with overlap stacking,
   user-managed categories (add / rename / delete w/ non-blocking warning),
   dd/mm/yyyy display, graying-out of past items, IndexedDB persistence.
============================================================================ */

/* ---- constants ---- */
const FIRST_YEAR = 2026, FIRST_MONTH = 10; // 0-based: 10 = November
const MONTH_W = 427;        // px width of one month block at zoom=1 (world units) — a third wider than 320
const AXIS_Y = 120;         // y of the axis line in world coords
const BLOCK_H = 150;        // height of the range band below the axis
// NuvaRing cycle strip (thin two-color bar at the bottom of the timeline)
const CYCLE_IN_DAYS = 21, CYCLE_OUT_DAYS = 7, CYCLE_LEN = CYCLE_IN_DAYS + CYCLE_OUT_DAYS;
const CYCLE_IN_COLOR = '#f7b9d4';   // light pink — ring IN (21 days)
const CYCLE_OUT_COLOR = '#b43d6f';  // dark pink  — ring OUT (7 days)
const CYCLE_H = 10;                 // strip thickness (world units)
const CYCLE_Y = AXIS_Y + BLOCK_H + 18; // y of the strip, below the range band
const GOAL_COLOR = '#f5c518';  // single, fixed goal color (gold) — distinct from event categories
const TODAY = startOfDay(new Date()); // real "today" (graying is live)
const UNCATEGORIZED = { id: 'uncat', name: 'Uncategorized', color: '#8390a3' };

function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

/* ---- default categories (seed only; fully editable afterwards) ---- */
const DEFAULT_CATEGORIES = [
  { id: 'c1', name: 'Deadline', color: '#e8743b' },
  { id: 'c2', name: 'Exam',     color: '#e74c3c' },
  { id: 'c3', name: 'Admin',    color: '#4f8cff' },
  { id: 'c4', name: 'Personal', color: '#2ecc71' },
];
function catById(id) {
  return state.categories.find(c => c.id === id) || UNCATEGORIZED;
}

/* ---- date helpers ---- */
const MONTH_NAMES = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
function monthOfIndex(i) { // i=0 -> Nov 2026
  const total = FIRST_MONTH + i;
  return { year: FIRST_YEAR + Math.floor(total / 12), month: ((total % 12) + 12) % 12 };
}
function parseISO(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function toISO(dt) { const p = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
// display: ISO (yyyy-mm-dd) -> dd/mm/yyyy
function fmtDMY(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
// map an ISO date -> world X on the axis (null if outside the added months)
function dateToX(iso) {
  const dt = parseISO(iso);
  for (let i = 0; i < state.monthCount; i++) {
    const { year, month } = monthOfIndex(i);
    if (year === dt.getFullYear() && month === dt.getMonth()) {
      const dim = daysInMonth(year, month);
      return i * MONTH_W + ((dt.getDate() - 1) / dim) * MONTH_W;
    }
  }
  return null; // date is before Nov 2026 or beyond the last added month
}
const axisEndX = () => state.monthCount * MONTH_W;

/* ---- recurrence engine (inlined verbatim from recurrence.mjs; do NOT change logic) ----
   index.html already defines parseISO/toISO/daysInMonth/startOfDay identically, so only
   durationDays/occurrencesBetween/expandItem are inlined here to keep one deployable file. */

// For a period item (start/end), recurrence shifts the START; the END keeps the
// same duration (in days) as the base occurrence.
function durationDays(startISO, endISO) {
  if (!endISO) return 0;
  return Math.round((parseISO(endISO) - parseISO(startISO)) / 86400000);
}

// Generate occurrence start-dates (ISO strings) for one item within [fromISO, toISO].
function occurrencesBetween(item, fromISO, toISO_) {
  const rule = item.repeat || 'none';
  const base = parseISO(item.date || item.startDate);
  const from = parseISO(fromISO), to = parseISO(toISO_);
  const out = [];

  if (rule === 'none') {
    if (base >= from && base <= to) out.push(toISO(base));
    return out;
  }

  if (rule === 'weekly') {
    // first occurrence on/after `from` that is congruent to base mod 7 days
    let d = new Date(base);
    if (d < from) {
      const diff = Math.ceil((from - d) / 86400000 / 7);
      d = new Date(base); d.setDate(d.getDate() + diff * 7);
    }
    for (; d <= to; d.setDate(d.getDate() + 7)) if (d >= base) out.push(toISO(startOfDay(d)));
    return out;
  }

  if (rule === 'monthly') {
    const dom = base.getDate();
    // iterate month by month from max(base month, from month)
    let y = Math.max(base.getFullYear(), from.getFullYear());
    let m = (y === base.getFullYear()) ? base.getMonth() : 0;
    if (y === from.getFullYear() && from.getMonth() > m) m = from.getMonth();
    let cur = new Date(y, m, 1);
    const baseMonthStart = new Date(base.getFullYear(), base.getMonth(), 1);
    if (cur < baseMonthStart) cur = baseMonthStart;
    for (; cur <= to; cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1)) {
      const clampedDay = Math.min(dom, daysInMonth(cur.getFullYear(), cur.getMonth()));
      const occ = new Date(cur.getFullYear(), cur.getMonth(), clampedDay);
      if (occ >= base && occ >= from && occ <= to) out.push(toISO(occ));
    }
    return out;
  }

  if (rule === 'yearly') {
    const mo = base.getMonth(), dom = base.getDate();
    for (let y = Math.max(base.getFullYear(), from.getFullYear()); ; y++) {
      const clampedDay = Math.min(dom, daysInMonth(y, mo));
      const occ = new Date(y, mo, clampedDay);
      if (occ > to) break;
      if (occ >= base && occ >= from) out.push(toISO(occ));
    }
    return out;
  }

  return out;
}

// Expand an item into concrete occurrences (with start/end ISO for periods).
function expandItem(item, fromISO, toISO_) {
  const dur = durationDays(item.date || item.startDate, item.endDate);
  return occurrencesBetween(item, fromISO, toISO_).map(startISO => {
    const start = parseISO(startISO);
    const end = new Date(start); end.setDate(end.getDate() + dur);
    return { ...item, _occStart: startISO, _occEnd: toISO(end) };
  });
}

/* ---- axis / calendar date spans ---- */
// ISO span covered by the currently-added timeline months (Nov 2026 .. end of last month)
function axisDateSpan() {
  const first = monthOfIndex(0);
  const last = monthOfIndex(state.monthCount - 1);
  return {
    from: toISO(new Date(first.year, first.month, 1)),
    to: toISO(new Date(last.year, last.month, daysInMonth(last.year, last.month))),
  };
}

// NuvaRing cycle: from a start date, 21 days IN then 7 days OUT, repeating every 28
// days, open-ended. Returns contiguous {phase:'in'|'out', start, end} segments (ISO,
// inclusive) overlapping [fromISO,toISO], clipped. (Verified in cycle.test.mjs.)
const _DAY_MS = 86400000;
function cycleSegments(startISO, fromISO, toISO_) {
  const start = parseISO(startISO), from = parseISO(fromISO), to = parseISO(toISO_);
  if (to < start) return [];
  const out = [];
  const dFrom = Math.max(0, Math.floor((from - start) / _DAY_MS));
  let k = Math.floor(dFrom / CYCLE_LEN);
  while (true) {
    const cycleStart = addDays(start, k * CYCLE_LEN);
    if (cycleStart > to) break;
    // start date = first day of the OUT week, then IN for 21 days.
    const outStart = cycleStart, outEnd = addDays(cycleStart, CYCLE_OUT_DAYS - 1);
    const inStart = addDays(cycleStart, CYCLE_OUT_DAYS), inEnd = addDays(cycleStart, CYCLE_LEN - 1);
    for (const seg of [{ phase:'out', s:outStart, e:outEnd }, { phase:'in', s:inStart, e:inEnd }]) {
      const lo = new Date(Math.max(seg.s, from, start));
      const hi = new Date(Math.min(seg.e, to));
      if (lo <= hi) out.push({ phase: seg.phase, start: toISO(lo), end: toISO(hi) });
    }
    k++;
  }
  return out;
}
// Calendar horizon: current month .. 31 Dec 2028 (navigation clamps to this range).
const CAL_HORIZON_END = new Date(2028, 11, 31);
function calMinMonth() { return new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); }
function calMaxMonth() { return new Date(CAL_HORIZON_END.getFullYear(), CAL_HORIZON_END.getMonth(), 1); }

/* ---- state + persistence (IndexedDB) ---- */
const DB_NAME = 'timeline-app', STORE = 'kv', KEY = 'state';
function freshState() {
  return { monthCount: 5, categories: DEFAULT_CATEGORIES.map(c => ({ ...c })), events: [], ranges: [], tasks: [], cycle: null, goals: [] };
}
let state = freshState();

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function loadState() {
  try {
    const db = await openDB();
    const v = await new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readonly').objectStore(STORE).get(KEY);
      tx.onsuccess = () => res(tx.result); tx.onerror = () => rej(tx.error);
    });
    if (v) { state = v; if (!state.categories) state.categories = DEFAULT_CATEGORIES.map(c => ({ ...c })); }
  } catch (e) { console.warn('load failed', e); }
  migrateState();
}
// backfill newer fields onto any previously-saved state (graceful migration)
function migrateState() {
  if (!Array.isArray(state.events)) state.events = [];
  if (!Array.isArray(state.ranges)) state.ranges = [];
  if (!Array.isArray(state.tasks)) state.tasks = [];
  if (state.cycle === undefined) state.cycle = null;
  if (!Array.isArray(state.goals)) state.goals = [];
  for (const g of state.goals) { if (!g.status) g.status = 'active'; }
  for (const e of state.events) if (e.repeat == null) e.repeat = 'none';
  for (const r of state.ranges) if (r.repeat == null) r.repeat = 'none';
  for (const t of state.tasks) if (t.repeat == null) t.repeat = 'none';
}
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const db = await openDB();
      db.transaction(STORE, 'readwrite').objectStore(STORE).put(state, KEY);
    } catch (e) { console.warn('save failed', e); }
  }, 150);
}
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---- view transform (pan/zoom) ---- */
const vp = document.getElementById('viewport');
const world = document.getElementById('world');
let view = { x: 20, y: 10, k: 1 };
function minZoom() { return vp.clientWidth / (2 * MONTH_W); } // fully out ≈ 2 months
function clampZoom(k) { return Math.min(2.5, Math.max(minZoom(), k)); }
function applyView() {
  view.k = clampZoom(view.k);
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  // fade the thin daily ticks once they get too dense to read (zoomed out)
  document.body.classList.toggle('zoomed-out', view.k < 0.6);
}
function fitToStart() {
  view.k = clampZoom(minZoom());
  view.x = 20; view.y = 10; applyView();
}

/* ---- rendering ---- */
const axisLayer = document.getElementById('axisLayer');
const edgeLayer = document.getElementById('edgeLayer');
const nodes = document.getElementById('nodes');
const svgNS = 'http://www.w3.org/2000/svg';
function line(x1,y1,x2,y2,stroke,w,dash) {
  const l = document.createElementNS(svgNS,'line');
  l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
  l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',w);
  if (dash) l.setAttribute('stroke-dasharray',dash);
  return l;
}

function renderAxis() {
  axisLayer.innerHTML = '';
  const endX = axisEndX();
  // main axis line
  axisLayer.appendChild(line(0, AXIS_Y, endX, AXIS_Y, '#cdd6e5', 2));

  [...nodes.querySelectorAll('.monthlabel,.addmonth,.delmonth,.sunnum')].forEach(n => n.remove());

  // Ruler ticks: a thin tick per day; a thicker, taller tick on Sundays with the
  // day-of-month number. Day ticks fade when zoomed out (CSS, via body.zoomed-out);
  // Sunday ticks and month boundaries never fade.
  for (let i = 0; i < state.monthCount; i++) {
    const { year, month } = monthOfIndex(i);
    const dim = daysInMonth(year, month);
    const monthX = i * MONTH_W;
    for (let day = 1; day <= dim; day++) {
      const x = monthX + ((day - 1) / dim) * MONTH_W;
      const dow = new Date(year, month, day).getDay(); // 0 = Sunday
      if (dow === 0) {
        // Sunday: thicker, taller tick + number (always visible)
        const t = line(x, AXIS_Y - 12, x, AXIS_Y + 12, '#aeb9ca', 1.6);
        t.setAttribute('class', 'sun-tick');
        axisLayer.appendChild(t);
        const num = document.createElement('div');
        num.className = 'sunnum';
        num.textContent = day;
        num.style.left = x + 'px';
        num.style.top = (AXIS_Y + 14) + 'px';
        nodes.appendChild(num);
      } else if (day > 1) {
        // ordinary day: thin short tick (fades when zoomed out); skip day 1 (month line covers it)
        const t = line(x, AXIS_Y - 5, x, AXIS_Y + 5, '#5b6677', 0.8);
        t.setAttribute('class', 'day-tick');
        axisLayer.appendChild(t);
      }
    }
  }

  // Month boundary lines: thicker + white, always visible, drawn on top of ticks.
  for (let i = 0; i <= state.monthCount; i++) {
    const x = i * MONTH_W;
    axisLayer.appendChild(line(x, AXIS_Y - 18, x, AXIS_Y + BLOCK_H, '#ffffff', 2.2));
  }

  // Month labels
  for (let i = 0; i < state.monthCount; i++) {
    const { year, month } = monthOfIndex(i);
    const lbl = document.createElement('div');
    lbl.className = 'monthlabel';
    lbl.textContent = `${MONTH_NAMES[month]} ${year}`;
    lbl.style.left = (i * MONTH_W) + 'px';
    lbl.style.top = (AXIS_Y - 42) + 'px';
    nodes.appendChild(lbl);
  }
  // "+" add next month (right end)
  const add = document.createElement('button');
  add.className = 'addmonth'; add.textContent = '+'; add.title = 'Add next month';
  add.style.left = (endX + 14) + 'px';
  add.style.top = (AXIS_Y - 15) + 'px';
  add.onpointerdown = e => e.stopPropagation();
  add.onclick = () => { state.monthCount++; save(); renderAll(); };
  nodes.appendChild(add);
  // "−" remove last month (only when more than 1 month, below the + so they don't overlap)
  if (state.monthCount > 1) {
    const del = document.createElement('button');
    del.className = 'delmonth'; del.textContent = '−'; del.title = 'Remove last month';
    del.style.left = (endX + 14) + 'px';
    del.style.top = (AXIS_Y + 22) + 'px';
    del.onpointerdown = e => e.stopPropagation();
    del.onclick = () => confirmDeleteMonth();
    nodes.appendChild(del);
  }
}

/* Expand ranges into axis-visible occurrences. Each occurrence carries the ORIGINAL
   range `r` (so edit/delete affect the whole series) plus its occurrence start/end. */
function timelineRangeOccurrences() {
  const { from, to } = axisDateSpan();
  const out = [];
  for (const r of state.ranges) {
    if ((r.repeat || 'none') === 'none') { out.push({ r, start: r.startDate, end: r.endDate }); continue; }
    for (const occ of expandItem(r, from, to)) out.push({ r, start: occ._occStart, end: occ._occEnd });
  }
  return out;
}

/* overlap stacking for ranges: greedy slot assignment within the band */
function assignRangeSlots(occs) {
  const items = occs.map(o => ({ r: o.r, start: o.start, end: o.end, a: dateToX(o.start), b: dateToX(o.end) }))
                      .filter(o => o.a !== null && o.b !== null)
                      .sort((p,q) => p.a - q.a);
  const slotEnds = [];
  for (const o of items) {
    let s = slotEnds.findIndex(end => end <= o.a);
    if (s === -1) { s = slotEnds.length; slotEnds.push(o.b); } else slotEnds[s] = o.b;
    o.slot = s;
  }
  return { items, maxSlots: Math.max(1, slotEnds.length) };
}

function renderRanges() {
  [...nodes.querySelectorAll('.range')].forEach(n => n.remove());
  const { items, maxSlots } = assignRangeSlots(timelineRangeOccurrences());
  const h = Math.max(16, Math.min(BLOCK_H * 0.5, (BLOCK_H - 8) / maxSlots));
  items.forEach(({ r, start, end, a, b, slot }) => {
    const cat = catById(r.categoryId);
    const el = document.createElement('div');
    el.className = 'range';
    const past = parseISO(end) < TODAY; // grayed only when ENTIRELY past
    if (past) el.classList.add('past');
    el.style.left = Math.min(a,b) + 'px';
    el.style.width = Math.max(6, Math.abs(b - a)) + 'px';
    el.style.top = (AXIS_Y + 6 + slot * (h + 4)) + 'px';
    el.style.height = h + 'px';
    el.style.background = hexToRgba(cat.color, 0.22);
    el.style.borderColor = hexToRgba(cat.color, 0.5);
    const rep = (r.repeat && r.repeat !== 'none') ? ' ↻' : '';
    el.innerHTML = `<div class="rh">${escapeHtml(r.header)}${rep}</div>`;
    el.title = `${r.header}\n${fmtDMY(start)} → ${fmtDMY(end)}`;
    el.onclick = e => { e.stopPropagation(); openEditRange(r); };
    nodes.appendChild(el);
  });
}

function renderEvents() {
  [...nodes.querySelectorAll('.card')].forEach(n => n.remove());
  edgeLayer.innerHTML = '';
  const { from, to } = axisDateSpan();
  for (const ev of state.events) {
    const cat = catById(ev.categoryId);
    // the base card (draggable, positioned by x,y)
    drawEventCard(ev, ev.date, ev.x, ev.y, cat, true);
    // extra occurrences for repeating events: non-draggable markers near their axis date
    if ((ev.repeat || 'none') !== 'none') {
      let i = 0;
      for (const iso of occurrencesBetween(ev, from, to)) {
        if (iso === ev.date) continue; // base already drawn
        const ax = dateToX(iso);
        if (ax === null) continue;
        const ox = ax + 12, oy = AXIS_Y + 70 + ((i++ % 3) * 46);
        drawEventCard(ev, iso, ox, oy, cat, false);
      }
    }
  }
}

/* Draw one event card. `isBase` -> draggable + expandable; otherwise a compact
   non-draggable occurrence marker that opens the (whole-series) edit on click. */
function drawEventCard(ev, iso, x, y, cat, isBase) {
  const ax = dateToX(iso);
  const past = parseISO(iso) < TODAY;
  const repMark = (ev.repeat && ev.repeat !== 'none') ? ' ↻' : '';
  const card = document.createElement('div');
  card.className = 'card';
  if (!isBase) card.style.width = '150px';
  card.style.left = x + 'px';
  card.style.top = y + 'px';
  card.style.borderLeftColor = cat.color;
  if (past) card.classList.add('past');
  const expanded = isBase && !!ev._open;
  card.innerHTML = `
    <div class="hdr"><span class="dot" style="background:${cat.color}"></span>${escapeHtml(ev.header)}${repMark}</div>
    <div class="date">${fmtDMY(iso)} · ${escapeHtml(cat.name)}</div>
    ${expanded ? `<div class="body">${escapeHtml(ev.text || '(no notes)')}</div>
      <div class="row"><button data-edit>Edit</button><button data-del class="danger">Delete</button></div>` : ''}`;
  if (ax !== null) {
    const cx = x + 16, cy = y + 10;
    edgeLayer.appendChild(line(ax, AXIS_Y, cx, cy, past ? '#6b7483' : cat.color, 1.5, '4 3'));
    const anchor = document.createElementNS(svgNS,'circle');
    anchor.setAttribute('cx', ax); anchor.setAttribute('cy', AXIS_Y);
    anchor.setAttribute('r', 3.5); anchor.setAttribute('fill', past ? '#6b7483' : cat.color);
    edgeLayer.appendChild(anchor);
  }
  if (isBase) {
    makeDraggable(card, ev);
    card.querySelector('[data-edit]')?.addEventListener('click', e => { e.stopPropagation(); openEditEvent(ev); });
    card.querySelector('[data-del]')?.addEventListener('click', e => { e.stopPropagation(); confirmDelete('event', ev); });
  } else {
    card.style.cursor = 'pointer';
    card.title = (ev.repeat && ev.repeat !== 'none') ? 'Repeating occurrence — edit affects the whole series' : '';
    card.addEventListener('click', e => { e.stopPropagation(); openEditEvent(ev); });
  }
  nodes.appendChild(card);
}

/* ---- NuvaRing cycle strip: thin two-color bar at the bottom of the timeline ---- */

    const x2 = endX + (1 / dim) * MONTH_W; // extend to cover the full last day
    const el = document.createElement('div');
    el.className = 'cycle-seg';

    el.style.width = Math.max(2, Math.abs(x2 - x1)) + 'px';
    el.style.top = CYCLE_Y + 'px';
    el.style.height = CYCLE_H + 'px';
    el.style.background = seg.phase === 'in' ? CYCLE_IN_COLOR : CYCLE_OUT_COLOR;
    el.title = seg.phase === 'in' ? 'Ring in (21 days)' : 'Ring out (7 days)';
    el.onclick = e => { e.stopPropagation(); openCycleDialog(); };
    nodes.appendChild(el);
  }
}

/* ---- dragging a card; click (no drag) toggles expand ---- */
function makeDraggable(card, ev) {
  let startX, startY, origX, origY, moved;
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.stopPropagation();
    card.setPointerCapture(e.pointerId);
    card.classList.add('dragging');
    startX = e.clientX; startY = e.clientY; origX = ev.x; origY = ev.y; moved = false;
    const move = m => {
      const dx = (m.clientX - startX) / view.k, dy = (m.clientY - startY) / view.k;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      ev.x = origX + dx; ev.y = origY + dy;
      card.style.left = ev.x + 'px'; card.style.top = ev.y + 'px';
      renderEvents();
    };
    const up = () => {
      card.releasePointerCapture(e.pointerId);
      card.classList.remove('dragging');
      vp.removeEventListener('pointermove', move); vp.removeEventListener('pointerup', up);
      if (moved) { save(); } else { ev._open = !ev._open; renderEvents(); }
    };
    vp.addEventListener('pointermove', move); vp.addEventListener('pointerup', up);
  });
}

/* ---- pan & zoom ---- */
let panning = false, panStart;
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('.card, .range, .addmonth, .delmonth, .goal-marker, .cycle-seg, .cycle-start, button')) return;
  panning = true; vp.classList.add('panning');
  panStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', e => {
  if (!panning) return;
  view.x = panStart.vx + (e.clientX - panStart.x);
  view.y = panStart.vy + (e.clientY - panStart.y);
  applyView();
});
vp.addEventListener('pointerup', () => { panning = false; vp.classList.remove('panning'); });
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = vp.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const prevK = view.k;
  const k = clampZoom(view.k * (e.deltaY < 0 ? 1.1 : 1/1.1));
  view.x = mx - ((mx - view.x) * (k / prevK));
  view.y = my - ((my - view.y) * (k / prevK));
  view.k = k; applyView();
}, { passive: false });

/* pinch-to-zoom (two-pointer) */
const pointers = new Map();
let pinchStart = null;
vp.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    panning = false; vp.classList.remove('panning');
    const [p1, p2] = [...pointers.values()];
    pinchStart = { dist: Math.hypot(p1.x-p2.x, p1.y-p2.y), k: view.k,
      cx: (p1.x+p2.x)/2, cy: (p1.y+p2.y)/2, vx: view.x, vy: view.y };
  }
});
vp.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2 && pinchStart) {
    const [p1, p2] = [...pointers.values()];
    const dist = Math.hypot(p1.x-p2.x, p1.y-p2.y);
    const rect = vp.getBoundingClientRect();
    const k = clampZoom(pinchStart.k * (dist / pinchStart.dist));
    const mx = pinchStart.cx - rect.left, my = pinchStart.cy - rect.top;
    view.x = mx - ((mx - pinchStart.vx) * (k / pinchStart.k));
    view.y = my - ((my - pinchStart.vy) * (k / pinchStart.k));
    view.k = k; applyView();
  }
});
function clearPointer(e) { pointers.delete(e.pointerId); if (pointers.size < 2) pinchStart = null; }
vp.addEventListener('pointerup', clearPointer);
vp.addEventListener('pointercancel', clearPointer);

/* ============================================================================
   Goals: two groups (short / long). Optional end date -> 🎯 marker on timeline.
   Resolving a goal archives it and scores it (+1 hit / -1 miss). Chart = the
   cumulative score over time; archive list = hits + misses with "try again".
   Scoring logic verified in goals.test.mjs.
============================================================================ */
const GOAL_GROUPS = [ { key: 'short', label: 'Short term' }, { key: 'long', label: 'Long term' } ];
let goalChartMode = 'chart'; // 'chart' | 'archive'

// Auto-miss timed, still-active, past-due goals. Returns true if anything changed.
function applyGoalAutoMiss() {
  let changed = false;
  for (const g of state.goals) {
    if (g.status === 'active' && !g.done && g.endDate && parseISO(g.endDate) < TODAY) {
      g.status = 'missed'; g.resolvedOn = g.endDate; changed = true;
    }
  }
  return changed;
}
// Cumulative-score series over time from resolved goals.
function goalScoreSeries() {
  const resolved = state.goals.filter(g => g.status === 'hit' || g.status === 'missed')
    .slice().sort((a, b) => a.resolvedOn < b.resolvedOn ? -1 : a.resolvedOn > b.resolvedOn ? 1 : 0);
  let cum = 0; const pts = [];
  for (const g of resolved) { cum += g.status === 'hit' ? 1 : -1; pts.push({ date: g.resolvedOn, score: cum, status: g.status, title: g.title }); }
  return pts;
}
function goalStats() {
  const resolved = state.goals.filter(g => g.status === 'hit' || g.status === 'missed');
  const hits = resolved.filter(g => g.status === 'hit').length;
  return { total: resolved.length, hits, misses: resolved.length - hits, successPct: resolved.length ? Math.round(hits / resolved.length * 100) : 0 };
}

function renderGoals() {
  if (applyGoalAutoMiss()) save();
  const body = document.getElementById('goalsbody');
  body.innerHTML = '';
  for (const grp of GOAL_GROUPS) {
    const active = state.goals.filter(g => g.group === grp.key && g.status === 'active');
    const wrap = document.createElement('div');
    wrap.className = 'goal-group';
    const h = document.createElement('h2');
    h.innerHTML = `${grp.label} <button class="addgoal" data-add>+ Add goal</button>`;
    wrap.appendChild(h);
    h.querySelector('[data-add]').onclick = () => openGoalDialog(null, grp.key);
    if (!active.length) {
      const e = document.createElement('div'); e.className = 'goal-empty'; e.textContent = 'No goals yet.';
      wrap.appendChild(e);
    }
    for (const g of active) wrap.appendChild(goalRow(g));
    body.appendChild(wrap);
  }
  // Reset (testing): clears all goals — active and archived (chart history).
  const resetWrap = document.createElement('div');
  resetWrap.style.cssText = 'margin-top:28px;padding-top:14px;border-top:1px solid #0006;';
  const rb = document.createElement('button');
  rb.className = 'danger'; rb.textContent = 'Reset goals…';
  rb.onclick = confirmResetGoals;
  resetWrap.appendChild(rb);
  body.appendChild(resetWrap);
}

// SVG line chart of cumulative score over time (stock-chart style).
function buildScoreChart() {
  const pts = goalScoreSeries();
  const W = Math.min(modal.clientWidth || 360, 400), H = 200, PAD = 24;
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', '100%'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.display = 'block';
  if (!pts.length) {
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', W/2); t.setAttribute('y', H/2); t.setAttribute('fill', '#93a0b4');
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '13');
    t.textContent = 'No resolved goals yet.'; svg.appendChild(t); return svg;
  }
  const scores = pts.map(p => p.score);
  const minS = Math.min(0, ...scores), maxS = Math.max(0, ...scores);
  const span = (maxS - minS) || 1;
  const n = pts.length;
  const xFor = i => PAD + (n === 1 ? (W - 2*PAD)/2 : (i/(n-1)) * (W - 2*PAD));
  const yFor = s => (H - PAD) - ((s - minS) / span) * (H - 2*PAD);
  // zero baseline
  const zeroY = yFor(0);
  svg.appendChild(line(PAD, zeroY, W - PAD, zeroY, '#3a4454', 1, '3 3'));
  // path
  let d = '';
  pts.forEach((p, i) => { d += (i ? 'L' : 'M') + xFor(i) + ' ' + yFor(p.score) + ' '; });
  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('d', d.trim()); path.setAttribute('fill', 'none');
  path.setAttribute('stroke', GOAL_COLOR); path.setAttribute('stroke-width', '2');
  svg.appendChild(path);
  // dots
  pts.forEach((p, i) => {
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', xFor(i)); c.setAttribute('cy', yFor(p.score)); c.setAttribute('r', 3.5);
    c.setAttribute('fill', p.status === 'hit' ? '#7fe0a0' : '#e98ba0');
    const title = document.createElementNS(svgNS, 'title');
    title.textContent = `${p.title} · ${p.status} · ${fmtDMY(p.date)} · score ${p.score}`;
    c.appendChild(title); svg.appendChild(c);
  });
  return svg;
}

function buildArchiveList() {
  const wrap = document.createElement('div');
  const resolved = state.goals.filter(g => g.status === 'hit' || g.status === 'missed')
    .slice().sort((a, b) => a.resolvedOn < b.resolvedOn ? 1 : -1); // newest first
  if (!resolved.length) { wrap.className = 'goal-empty'; wrap.textContent = 'No archived goals yet.'; return wrap; }
  for (const g of resolved) {
    const row = document.createElement('div');
    row.className = 'arch-item';
    row.innerHTML = `
      <span class="tag ${g.status}">${g.status === 'hit' ? '+1' : '−1'}</span>
      <span class="at"><b>${escapeHtml(g.title)}</b> <span class="adate">· ${fmtDMY(g.resolvedOn)}</span></span>
      ${g.status === 'missed' ? '<button class="gmiss" data-retry>Try again</button>' : ''}`;
    const retry = row.querySelector('[data-retry]');
    if (retry) retry.onclick = () => {
      // Keep the missed record in the archive (its -1 stays on the chart);
      // open an editable COPY as a brand-new goal so the user can set a new date.
      closeModal();
      openGoalDialog(null, g.group, { title: g.title, group: g.group, endDate: g.endDate || null, notes: g.notes || '' });
    };
    wrap.appendChild(row);
  }
  return wrap;
}

function confirmDelete(kind, item) {

      ? `<div class="warn">“${escapeHtml(item.header)}” repeats (${item.repeat}). Deleting removes the <b>entire repeating series</b>. This can't be undone.</div>`
      : `<p style="color:var(--muted)">“${escapeHtml(item.header)}” will be removed. This can't be undone.</p>`}

      <button id="f_ok" class="danger">${repeating ? 'Delete series' : 'Delete'}</button></div>`;
  scrim.classList.add('show');
  modal.querySelector('#f_cancel').onclick = closeModal;
  modal.querySelector('#f_ok').onclick = () => {
    if (kind === 'event') state.events = state.events.filter(e => e.id !== item.id);
    else if (kind === 'range') state.ranges = state.ranges.filter(r => r.id !== item.id);
    else state.tasks = state.tasks.filter(t => t.id !== item.id);

}

function confirmDeleteMonth() {
  const { year, month } = monthOfIndex(state.monthCount - 1);
  const label = `${MONTH_NAMES[month]} ${year}`;
  // count items that live in this last month (they'd lose their axis position)
  const start = toISO(new Date(year, month, 1));
  const end = toISO(new Date(year, month, daysInMonth(year, month)));
  const inMonth = iso => iso >= start && iso <= end;
  const affected = state.events.filter(e => inMonth(e.date)).length
    + state.ranges.filter(r => inMonth(r.startDate) || inMonth(r.endDate)).length;
  modal.innerHTML = `
    <h3>Remove last month?</h3>
    <p style="color:var(--muted)">This removes <b>${label}</b> from the end of the timeline.</p>
    ${affected ? `<div class="warn">${affected} item(s) fall in this month. They stay saved, but won't show on the axis until you add the month back.</div>` : ''}
    <div class="actions"><button id="f_cancel">Cancel</button>
      <button id="f_ok" class="danger">Remove month</button></div>`;
  scrim.classList.add('show');
  modal.querySelector('#f_cancel').onclick = closeModal;
  modal.querySelector('#f_ok').onclick = () => {
    if (state.monthCount > 1) state.monthCount--;

  };
}

function confirmDeleteCategory(id) {
  const cat = state.categories.find(c => c.id === id);
  if (!cat) return;
  const used = state.events.filter(e => e.categoryId === id).length
    + state.ranges.filter(r => r.categoryId === id).length
    + state.tasks.filter(t => t.categoryId === id).length;
  modal.innerHTML = `

    state.ranges.forEach(r => { if (r.categoryId === id) r.categoryId = UNCATEGORIZED.id; });
    state.tasks.forEach(t => { if (t.categoryId === id) t.categoryId = UNCATEGORIZED.id; });
    state.categories = state.categories.filter(c => c.id !== id);
    save(); renderAll(); openCategoryManager();
  };
}

/* ============================================================================
   CALENDAR SECTION — month + week views, offline, same IndexedDB arrays.
   Reads state.events / state.ranges (shared with the timeline) and state.tasks
   (calendar only). Recurrence is expanded within the visible window.
============================================================================ */
let currentView = 'timeline';     // 'timeline' | 'calendar'
let calMode = 'month';            // 'month' | 'week'
let calAnchor = startOfDay(new Date()); // a date inside the currently-shown period

const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CAL_HOUR_START = 6, CAL_HOUR_END = 24; // week-view hour grid
const calbody = document.getElementById('calbody');
const calPeriodLabel = document.getElementById('cal_period');

// Monday-based weekday index (Mon=0 .. Sun=6)
function mondayIndex(dt) { return (dt.getDay() + 6) % 7; }
function addDays(dt, n) { const d = new Date(dt); d.setDate(d.getDate() + n); return d; }
function sameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function clampMonthAnchor(dt) {
  const m = new Date(dt.getFullYear(), dt.getMonth(), 1);
  if (m < calMinMonth()) return calMinMonth();
  if (m > calMaxMonth()) return calMaxMonth();
  return dt;
}
function minutesOfTime(hhmm) { const [h,m] = (hhmm||'0:0').split(':').map(Number); return h*60 + (m||0); }

// Collect the visible window [fromISO, toISO] for the current period.
function calWindow() {
  if (calMode === 'month') {
    const y = calAnchor.getFullYear(), m = calAnchor.getMonth();
    const first = new Date(y, m, 1);
    const gridStart = addDays(first, -mondayIndex(first));
    const gridEnd = addDays(gridStart, 41); // 6 weeks
    return { from: toISO(gridStart), to: toISO(gridEnd), gridStart };
  } else {
    const weekStart = addDays(calAnchor, -mondayIndex(calAnchor));
    const weekEnd = addDays(weekStart, 6);
    return { from: toISO(weekStart), to: toISO(weekEnd), weekStart };
  }
}

// Build a per-ISO-day index of items (events, period occurrences, tasks) in the window.
// Returns { days: Map<iso, {events:[], periods:[], tasks:[]}>, periodsAll:[] }
function calItemsInWindow(fromISO, toISO_) {
  const days = new Map();
  const dayOf = iso => { if (!days.has(iso)) days.set(iso, { events: [], periods: [], tasks: [] }); return days.get(iso); };

  for (const ev of state.events)
    for (const iso of occurrencesBetween(ev, fromISO, toISO_))
      dayOf(iso).events.push({ ref: ev, date: iso });

  const periodsAll = [];
  for (const r of state.ranges)
    for (const occ of expandItem(r, fromISO, toISO_)) {
      const seg = { ref: r, start: occ._occStart, end: occ._occEnd };
      periodsAll.push(seg);
      // mark every day the period covers (within window)
      let d = parseISO(occ._occStart), end = parseISO(occ._occEnd);
      const winFrom = parseISO(fromISO), winTo = parseISO(toISO_);
      if (d < winFrom) d = new Date(winFrom);
      for (; d <= end && d <= winTo; d = addDays(d, 1)) dayOf(toISO(d)).periods.push(seg);
    }

  for (const t of state.tasks)
    for (const iso of occurrencesBetween(t, fromISO, toISO_))
      dayOf(iso).tasks.push({ ref: t, date: iso });

  return { days, periodsAll };
}

function setView(v) {
  currentView = v;
  document.body.classList.toggle('calendar', v === 'calendar');
  document.body.classList.toggle('goals', v === 'goals');
  document.getElementById('nav_timeline').classList.toggle('active', v === 'timeline');
  document.getElementById('nav_calendar').classList.toggle('active', v === 'calendar');
  document.getElementById('nav_goals').classList.toggle('active', v === 'goals');
  if (v === 'calendar') { calAnchor = clampMonthAnchor(calAnchor); renderCalendar(); }
  else if (v === 'goals') { renderGoals(); }
  else renderAll();
}

function calShift(dir) {
  if (calMode === 'month') {
    const next = new Date(calAnchor.getFullYear(), calAnchor.getMonth() + dir, 1);
    const clamped = clampMonthAnchor(next);
    // only move if within horizon
    if (clamped.getFullYear() === next.getFullYear() && clamped.getMonth() === next.getMonth()) calAnchor = next;
    else return;
  } else {
    const next = addDays(calAnchor, dir * 7);
    const nextMonth = new Date(next.getFullYear(), next.getMonth(), 1);
    if (nextMonth < calMinMonth() || nextMonth > calMaxMonth()) return;
    calAnchor = next;
  }
  renderCalendar();
}

function renderCalendar() {
  updateCalNav();
  if (calMode === 'month') renderCalMonth(); else renderCalWeek();
}

function updateCalNav() {
  document.getElementById('cm_month').classList.toggle('active', calMode === 'month');
  document.getElementById('cm_week').classList.toggle('active', calMode === 'week');
  if (calMode === 'month') {
    calPeriodLabel.textContent = `${MONTH_NAMES[calAnchor.getMonth()]} ${calAnchor.getFullYear()}`;
  } else {
    const ws = addDays(calAnchor, -mondayIndex(calAnchor));
    const we = addDays(ws, 6);
    calPeriodLabel.textContent = `${fmtDMY(toISO(ws))} – ${fmtDMY(toISO(we))}`;
  }
}

function catChip(ref, labelText, isPeriod) {
  const cat = catById(ref.categoryId);
  const chip = document.createElement('div');
  chip.className = 'cal-chip' + (isPeriod ? ' period' : '');
  const rep = (ref.repeat && ref.repeat !== 'none') ? ' ↻' : '';
  chip.textContent = labelText + rep;
  if (isPeriod) { chip.style.background = hexToRgba(cat.color, 0.85); }
  else { chip.style.borderLeftColor = cat.color; chip.style.background = hexToRgba(cat.color, 0.18); }
  chip.title = `${ref.header}${rep}`;
  return chip;
}

function openItemEditor(ref) {
  if (ref.startTime !== undefined) openEditTask(ref);
  else if (ref.startDate !== undefined) openEditRange(ref);
  else openEditEvent(ref);
}

function renderCalMonth() {
  const { from, to, gridStart } = calWindow();
  const { days } = calItemsInWindow(from, to);
  calbody.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'cal-weekhead';
  for (const w of WEEKDAYS) { const d = document.createElement('div'); d.textContent = w; head.appendChild(d); }
  calbody.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'cal-month';
  const month = calAnchor.getMonth();
  for (let i = 0; i < 42; i++) {
    const day = addDays(gridStart, i);
    const iso = toISO(day);
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    if (day.getMonth() !== month) cell.classList.add('othermonth');
    if (day < TODAY) cell.classList.add('past');
    if (sameDay(day, TODAY)) cell.classList.add('today');
    const num = document.createElement('div');
    num.className = 'cal-daynum'; num.textContent = day.getDate();
    cell.appendChild(num);

    const bucket = days.get(iso);
    const chips = [];
    if (bucket) {
      for (const p of bucket.periods) chips.push(catChip(p.ref, p.ref.header, true));
      for (const e of bucket.events) chips.push(catChip(e.ref, e.ref.header, false));
      for (const t of bucket.tasks) chips.push(catChip(t.ref, `${t.ref.startTime} ${t.ref.header}`, false));
    }
    const MAX = 4;
    chips.slice(0, MAX).forEach((chip, idx) => {
      const ref = bucketRefAt(bucket, idx);
      chip.addEventListener('click', e => { e.stopPropagation(); openItemEditor(ref); });
      cell.appendChild(chip);
    });
    if (chips.length > MAX) {
      const more = document.createElement('div');
      more.className = 'cal-more'; more.textContent = `+${chips.length - MAX} more`;
      cell.appendChild(more);
    }
    cell.addEventListener('click', () => openAddChooser(iso));
    grid.appendChild(cell);
  }
  calbody.appendChild(grid);
}

// resolve the ref that corresponds to chip index `idx` in a day's ordered chip list
function bucketRefAt(bucket, idx) {
  if (!bucket) return null;
  const ordered = [
    ...bucket.periods.map(p => p.ref),
    ...bucket.events.map(e => e.ref),
    ...bucket.tasks.map(t => t.ref),
  ];
  return ordered[idx];
}

function renderCalWeek() {
  const { from, to, weekStart } = calWindow();
  const { days } = calItemsInWindow(from, to);
  calbody.innerHTML = '';
  const weekDates = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));

  // header row with weekday + date
  const head = document.createElement('div');
  head.className = 'cal-week-head';
  const corner = document.createElement('div'); corner.className = 'wh'; corner.textContent = '';
  head.appendChild(corner);
  weekDates.forEach((d, i) => {
    const wh = document.createElement('div');
    wh.className = 'wh' + (sameDay(d, TODAY) ? ' today' : '');
    wh.innerHTML = `${WEEKDAYS[i]}<br><span class="wd">${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')}</span>`;
    head.appendChild(wh);
  });
  calbody.appendChild(head);

  // all-day row: events (day) + period occurrences
  const allday = document.createElement('div');
  allday.className = 'cal-week-allday';
  const adLabel = document.createElement('div'); adLabel.className = 'ad-label'; adLabel.textContent = 'All-day';
  allday.appendChild(adLabel);
  weekDates.forEach(d => {
    const col = document.createElement('div');
    col.className = 'ad-col' + (d < TODAY ? ' past' : '');
    const bucket = days.get(toISO(d));
    if (bucket) {
      for (const p of bucket.periods) {
        const chip = catChip(p.ref, p.ref.header, true);
        chip.addEventListener('click', e => { e.stopPropagation(); openItemEditor(p.ref); });
        col.appendChild(chip);
      }
      for (const ev of bucket.events) {
        const chip = catChip(ev.ref, ev.ref.header, false);
        chip.addEventListener('click', e => { e.stopPropagation(); openItemEditor(ev.ref); });
        col.appendChild(chip);
      }
    }
    col.addEventListener('click', () => openAddChooser(toISO(d)));
    allday.appendChild(col);
  });
  calbody.appendChild(allday);

  // hour grid
  const hours = document.createElement('div');
  hours.className = 'cal-hours';
  for (let h = CAL_HOUR_START; h < CAL_HOUR_END; h++) {
    const row = document.createElement('div');
    row.className = 'cal-hourrow';
    const lbl = document.createElement('div');
    lbl.className = 'hr-label'; lbl.textContent = `${String(h).padStart(2,'0')}:00`;
    row.appendChild(lbl);
    weekDates.forEach(d => {
      const cell = document.createElement('div');
      cell.className = 'hr-cell';
      const hh = h;
      cell.addEventListener('click', () => openCreateTaskAt(toISO(d), hh));
      row.appendChild(cell);
    });
    hours.appendChild(row);
  }
  // timed task overlay
  const overlay = document.createElement('div');
  overlay.className = 'cal-weekcols';
  const ROW_H = 44, totalMin = (CAL_HOUR_END - CAL_HOUR_START) * 60;
  weekDates.forEach(d => {
    const colWrap = document.createElement('div');
    colWrap.className = 'cal-weekcol';
    const bucket = days.get(toISO(d));
    if (bucket) {
      for (const tk of bucket.tasks) {
        const t = tk.ref;
        const s = Math.max(minutesOfTime(t.startTime), CAL_HOUR_START * 60);
        const e = Math.min(minutesOfTime(t.endTime), CAL_HOUR_END * 60);
        if (e <= CAL_HOUR_START * 60 || s >= CAL_HOUR_END * 60) continue;
        const top = ((s - CAL_HOUR_START * 60) / 60) * ROW_H;
        const height = Math.max(16, ((e - s) / 60) * ROW_H);
        const cat = catById(t.categoryId);
        const box = document.createElement('div');
        box.className = 'cal-task' + (d < TODAY ? ' past' : '');
        box.style.top = top + 'px';
        box.style.height = height + 'px';
        box.style.background = hexToRgba(cat.color, 0.9);
        const rep = (t.repeat && t.repeat !== 'none') ? ' ↻' : '';
        box.innerHTML = `<div class="tt">${escapeHtml(t.startTime)} ${escapeHtml(t.header)}${rep}</div>`;
        box.title = `${t.header}\n${t.startTime}–${t.endTime}`;
        box.addEventListener('click', ev => { ev.stopPropagation(); openEditTask(t); });
        colWrap.appendChild(box);
      }
    }
    overlay.appendChild(colWrap);
  });
  hours.appendChild(overlay);
  calbody.appendChild(hours);
}

// open the task dialog prefilled with a date and a start hour from the week grid
function openCreateTaskAt(dateISO, hour) {
  openCreateTask(dateISO);
  const s = modal.querySelector('#f_start'), en = modal.querySelector('#f_end');
  if (s && en) {
    s.value = `${String(hour).padStart(2,'0')}:00`;
    en.value = `${String(Math.min(hour + 1, 23)).padStart(2,'0')}:00`;
  }
}

/* ---- small utils ---- */
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function escapeHtml(s='') { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s='') { return escapeHtml(s); }

/* ---- left drawer (primary nav) ---- */
const menuBtn = document.getElementById('menuBtn');
const drawerBackdrop = document.getElementById('drawerBackdrop');
function closeDrawer() { document.body.classList.remove('drawer-open'); }
function toggleDrawer() { document.body.classList.toggle('drawer-open'); }
menuBtn.onclick = e => { e.stopPropagation(); toggleDrawer(); };
drawerBackdrop.onclick = closeDrawer;

document.getElementById('nav_timeline').onclick = () => { setView('timeline'); closeDrawer(); };
document.getElementById('nav_calendar').onclick = () => { setView('calendar'); closeDrawer(); };
document.getElementById('nav_goals').onclick = () => { setView('goals'); closeDrawer(); };
document.getElementById('nav_cats').onclick = () => { closeDrawer(); openCategoryManager(); };
document.getElementById('goalChartBtn').onclick = () => openGoalChart();
document.getElementById('nav_fit').onclick = () => { closeDrawer(); setView('timeline'); fitToStart(); };

/* ---- floating add button (timeline) ---- */
const fab = document.getElementById('fab');
const fabMenu = document.getElementById('fabMenu');
function closeFab() { fabMenu.classList.remove('show'); }
fab.onclick = e => { e.stopPropagation(); fabMenu.classList.toggle('show'); };
document.addEventListener('click', e => { if (!fabMenu.contains(e.target) && e.target !== fab) closeFab(); });
document.getElementById('fab_event').onclick = () => { closeFab(); openCreate('event'); };
document.getElementById('fab_range').onclick = () => { closeFab(); openCreate('range'); };
document.getElementById('fab_cats').onclick = () => { closeFab(); openCategoryManager(); };

/* ---- calendar navigation ---- */
document.getElementById('cal_prev').onclick = () => calShift(-1);
document.getElementById('cal_next').onclick = () => calShift(1);
document.getElementById('cal_today').onclick = () => { calAnchor = clampMonthAnchor(startOfDay(new Date())); renderCalendar(); };
document.getElementById('cm_month').onclick = () => { calMode = 'month'; calAnchor = clampMonthAnchor(calAnchor); renderCalendar(); };
document.getElementById('cm_week').onclick = () => { calMode = 'week'; renderCalendar(); };

window.addEventListener('resize', applyView);

/* ---- seed sample data (first run only) ---- */
function seedIfEmpty(force=false) {
  if (!force && (state.events.length || state.ranges.length)) return;
  state.events = [
    { id: uid(), categoryId: 'c1', header: 'Frist RISE',  date: '2026-11-30', text: 'Application deadline for RISE.', repeat: 'none', x: 40,  y: 260, _open: false },
    { id: uid(), categoryId: 'c2', header: 'ML Exam',      date: '2026-12-15', text: 'Machine learning written exam.', repeat: 'none', x: 360, y: 300, _open: false },
    { id: uid(), categoryId: 'c3', header: 'DADH Exam',    date: '2027-01-13', text: 'Date to be confirmed.',          repeat: 'none', x: 740, y: 250, _open: false },
  ];
  state.ranges = [
    { id: uid(), categoryId: 'c4', header: 'Semester break', startDate: '2026-12-20', endDate: '2027-01-10', text: 'Holiday period.', repeat: 'none' },
    { id: uid(), categoryId: 'c3', header: 'Exam phase',     startDate: '2027-01-05', endDate: '2027-02-15', text: 'Overlaps the break to show stacking.', repeat: 'none' },
  ];
  if (!Array.isArray(state.tasks)) state.tasks = [];
}

/* ---- service worker (offline / installable) ---- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed', err));
  });
}

/* ---- boot ---- */
(async function main() {
  await loadState();
  seedIfEmpty();
  view.k = clampZoom(Math.max(minZoom(), 0.6));
  renderAll();
})();
</script>
</body>
</html>
